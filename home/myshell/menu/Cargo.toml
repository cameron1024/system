[package]
name = "myshell-menu"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# Its own crate (not a binary of the shell's), so it builds in seconds, without GPUI.
[dependencies]
clap = { version = "4", features = ["derive"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
lto = true
strip = true
